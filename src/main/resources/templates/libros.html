<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/}">BIBLIOTECA</a>
            <ul class="navbar-nav flex-row gap-3 ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/vista/libros}">Libros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/vista/personas}">Personas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/vista/prestamos}">Prestamos</a></li>
            </ul>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administracion</p>
                <h1 class="h2 mb-0">Libros</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(libros)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar libro</h2>
                    <form th:action="@{/vista/libros/guardar}" th:object="${libro}" method="post">
                        <div class="mb-3"><label class="form-label" for="isbn">ISBN</label><input id="isbn" class="form-control" type="number" min="1" th:field="*{isbn}" required></div>
                        <div class="mb-3"><label class="form-label" for="titulo">Titulo</label><input id="titulo" class="form-control" th:field="*{titulo}" required></div>
                        <div class="mb-3"><label class="form-label" for="autor">Autor</label><input id="autor" class="form-control" th:field="*{autor}" required></div>
                        <div class="mb-3"><label class="form-label" for="editorial">Editorial</label><input id="editorial" class="form-control" th:field="*{editorial}"></div>
                        <div class="mb-3"><label class="form-label" for="anioPublicacion">Año de publicacion</label><input id="anioPublicacion" class="form-control" inputmode="numeric" maxlength="4" pattern="\d{4}" title="Debe tener 4 digitos" th:field="*{anoPublicacion}" required></div>
                        <div class="mb-4"><label class="form-label" for="numeroEjemplares">Ejemplares disponibles</label><input id="numeroEjemplares" class="form-control" type="number" min="0" th:field="*{numEjemplares}" required></div>
                        <button class="btn btn-primary w-100" type="submit">Guardar libro</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Catalogo</h2><input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar titulo o autor"></div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaLibros">
                            <thead><tr><th>ISBN</th><th>Titulo</th><th>Autor</th><th>Editorial</th><th>Año</th><th>Disponibles</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="item : ${libros}">
                                    <td th:text="${item.isbn}"></td><td th:text="${item.titulo}"></td><td th:text="${item.autor}"></td><td th:text="${item.editorial}"></td><td th:text="${item.anoPublicacion}"></td><td th:text="${item.numEjemplares}"></td>
                                    <td class="text-end text-nowrap">
                                        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" th:data-bs-target="'#editar-' + ${item.isbn}">Editar</button>
                                        <form class="d-inline" th:action="@{/vista/libros/{isbn}/eliminar(isbn=${item.isbn})}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Eliminar este libro?')">Eliminar</button></form>

                                        <div class="modal fade text-start" th:id="'editar-' + ${item.isbn}" tabindex="-1" aria-hidden="true">
                                            <div class="modal-dialog"><div class="modal-content"><form th:action="@{/vista/libros/{isbn}/actualizar(isbn=${item.isbn})}" method="post">
                                                <div class="modal-header"><h3 class="modal-title fs-5">Editar libro</h3><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                                <div class="modal-body">
                                                    <div class="mb-3"><label class="form-label">Titulo</label><input class="form-control" name="titulo" th:value="${item.titulo}" required></div>
                                                    <div class="mb-3"><label class="form-label">Autor</label><input class="form-control" name="autor" th:value="${item.autor}" required></div>
                                                    <div class="mb-3"><label class="form-label">Editorial</label><input class="form-control" name="editorial" th:value="${item.editorial}"></div>
                                                    <div class="mb-3"><label class="form-label">Año de publicacion</label><input class="form-control" name="anoPublicacion" inputmode="numeric" maxlength="4" pattern="\d{4}" title="Debe tener 4 digitos" th:value="${item.anoPublicacion}" required></div>
                                                    <div><label class="form-label">Ejemplares disponibles</label><input class="form-control" name="numEjemplares" type="number" min="0" th:value="${item.numEjemplares}" required></div>
                                                </div>
                                                <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
                                            </form></div></div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(libros)}"><td colspan="7" class="text-center text-secondary py-4">No hay libros registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // El buscador ignora la ultima celda (botones y modal de edicion) para no coincidir con sus textos
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaLibros tbody tr').forEach(function (row) {
                const celdas = Array.from(row.children);
                const visibles = celdas.length > 1 ? celdas.slice(0, -1) : celdas;
                const texto = visibles.map(function (celda) { return celda.textContent; }).join(' ').toLowerCase();
                row.style.display = texto.includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
